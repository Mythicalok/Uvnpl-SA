<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credits - UV Netware</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      background: #070a0f;
      color: #fff;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 40px;
      text-align: center;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.5rem;
      margin-bottom: 40px;
      letter-spacing: 0.02em;
      color: #60a5fa;
      text-shadow: 0 0 18px rgba(96,165,250,0.4);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: rgba(30,37,51,.9);
      border: 1px solid rgba(96,165,250,.22);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      padding: 20px;
      border-radius: 16px;
      transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 30px rgba(59,130,246,0.4);
      border-color: rgba(96,165,250,.4);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(96,165,250,.22);
    }

    .card h3 {
      margin: 15px 0 8px;
      font-size: 1.25rem;
      color: #e2e8f0;
    }

    .links {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(59,130,246,0.17);
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }

    .links a:hover {
      background: rgba(59,130,246,0.32);
      transform: translateY(-1px);
      text-decoration: none;
    }

    .back-link {
      margin-top: 36px;
      display: inline-block;
      color: #93c5fd;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid rgba(59,130,246,.3);
      padding: 10px 16px;
      border-radius: 999px;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .back-link:hover {
      background: rgba(59, 130, 246, 0.2);
      box-shadow: 0 0 18px rgba(96,165,250, 0.3);
    }

    @media (max-width: 640px) {
      body { padding: 30px 16px; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>

<body>

<h1>Our Team </h1>

<div class="grid">
  <div class="card">
    <img src="_site\assets\images\Niraj_jain.jpg" alt="Niraj Jain" loading="lazy" onerror="this.onerror=null; this.src='assets/images/icon.jpg'" />
    <h3>Niraj Jain</h3>
    <div class="links">
      <a href="https://www.linkedin.com/in/nirajjain210251/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://github.com/nirajjain819" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </div>

  <div class="card">
    <img src="assets/images/icon.jpg" alt="alok" loading="lazy" onerror="this.onerror=null; this.src='assets/images/icon.jpg'" />
    <h3>alok</h3>
    <div class="links">
      <a href="https://www.linkedin.com/in/alok" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://github.com/alok" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </div>

  <div class="card">
    <img src="assets/images/vedant.jpeg" alt="vedant" loading="lazy" onerror="this.onerror=null; this.src='assets/images/icon.jpg'" />
    <h3>vedant</h3>
    <div class="links">
      <a href="https://www.linkedin.com/in/rahul-patel" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://github.com/rahulpatel" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </div>

  <div class="card">
    <img src="assets/images/icon.jpg" alt="Anika Reddy" loading="lazy" onerror="this.onerror=null; this.src='assets/images/icon.jpg'" />
    <h3>Anika Reddy</h3>
    <div class="links">
      <a href="https://www.linkedin.com/in/anika-reddy" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://github.com/anikareddy" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </div>
</div>

<a class="back-link" href="/">← Back to Home</a>

</body>
</html>
