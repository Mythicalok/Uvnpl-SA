<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credits — The Team</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --card: #16161f;
      --border: rgba(255, 255, 255, 0.07);
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --text: #e8e8f0;
      --muted: #7a7a90;
      --github: #e8e8f0;
      --linkedin: #0a66c2;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Noise overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Gold orb ── */
    .orb {
      position: fixed;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.12) 0%, transparent 70%);
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.7;
        transform: translateX(-50%) scale(1);
      }

      50% {
        opacity: 1;
        transform: translateX(-50%) scale(1.08);
      }
    }

    /* ── Hero ── */
    .hero {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 100px 24px 60px;
    }

    .hero-label {
      display: inline-block;
      letter-spacing: 0.28em;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid rgba(201, 168, 76, 0.3);
      padding: 6px 18px;
      border-radius: 40px;
      margin-bottom: 32px;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(52px, 8vw, 96px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, var(--gold-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }

    .hero p {
      color: var(--muted);
      font-size: 16px;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* ── Divider ── */
    .divider {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto 64px;
      padding: 0 40px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    .divider-icon {
      color: var(--gold);
      font-size: 18px;
    }

    /* ── Grid ── */
    .grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 40px 80px;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.35s cubic-bezier(.22, 1, .36, 1), border-color 0.3s, box-shadow 0.35s;
      cursor: default;
      animation: fadeUp 0.6s ease both;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(201, 168, 76, 0.25);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(201, 168, 76, 0.08);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* stagger */
    .card:nth-child(1) {
      animation-delay: 0.05s;
    }

    .card:nth-child(2) {
      animation-delay: 0.10s;
    }

    .card:nth-child(3) {
      animation-delay: 0.15s;
    }

    .card:nth-child(4) {
      animation-delay: 0.20s;
    }

    .card:nth-child(5) {
      animation-delay: 0.25s;
    }

    .card:nth-child(6) {
      animation-delay: 0.30s;
    }

    .card:nth-child(7) {
      animation-delay: 0.35s;
    }

    .card:nth-child(8) {
      animation-delay: 0.40s;
    }

    .card:nth-child(9) {
      animation-delay: 0.45s;
    }

    .card:nth-child(10) {
      animation-delay: 0.50s;
    }

    .card:nth-child(11) {
      animation-delay: 0.55s;
    }

    .card:nth-child(12) {
      animation-delay: 0.60s;
    }

    .card:nth-child(13) {
      animation-delay: 0.65s;
    }

    .card:nth-child(14) {
      animation-delay: 0.70s;
    }

    .card:nth-child(15) {
      animation-delay: 0.75s;
    }

    /* Avatar ring */
    .avatar-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 20px;
    }

    .avatar-wrap::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(var(--gold), transparent 40%, var(--gold-light), transparent 80%, var(--gold));
      animation: spin 8s linear infinite;
      opacity: 0;
      transition: opacity 0.35s;
    }

    .card:hover .avatar-wrap::before {
      opacity: 1;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .avatar-wrap::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--card);
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
      background: var(--surface);
    }

    /* Number badge */
    .badge {
      position: absolute;
      bottom: 0;
      right: 0;
      z-index: 2;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--gold);
      color: #0a0a0f;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--card);
    }

    .card-name {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }

    .card-role {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .card-bio {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 22px;
      flex: 1;
    }

    /* Links */
    .links {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
      border: 1px solid var(--border);
    }

    .link-btn:hover {
      transform: scale(1.05);
      opacity: 0.85;
    }

    .link-btn.github {
      background: rgba(255, 255, 255, 0.05);
      color: var(--github);
    }

    .link-btn.linkedin {
      background: rgba(10, 102, 194, 0.15);
      color: #5ba4f5;
      border-color: rgba(10, 102, 194, 0.25);
    }

    .link-btn svg {
      flex-shrink: 0;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 24px 60px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    footer span {
      color: var(--gold);
    }

    @media (max-width: 600px) {
      .grid {
        padding: 0 16px 60px;
        gap: 16px;
      }

      .hero {
        padding: 70px 20px 40px;
      }
    }
  </style>
</head>
